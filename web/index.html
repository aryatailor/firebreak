<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebreak</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="intro" data-flow="armed">
<div id="map"></div>

<div id="brand">
  <svg class="brand-mark" viewBox="0 0 52 8" aria-hidden="true">
    <path d="M0 4 H22 M30 4 H52"/>
  </svg>
  <span class="brand-word">FIREBREAK</span>
</div>
<div id="legend" hidden></div>
<div id="break-tip" class="mono" hidden></div>

<select id="town-select" class="mono" hidden></select>
<div id="crawl" hidden><p id="crawl-line"></p></div>

<div id="caption" class="mono" hidden>
  <p id="caption-text"></p>
  <button id="caption-btn" type="button" hidden></button>
</div>
<button id="skip" type="button" class="mono" hidden>Skip intro</button>
<div id="point-arrow" class="mono" hidden>&#10230;</div>

<div id="intro">
  <svg id="heat-defs" aria-hidden="true">
    <filter id="heat" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence id="heat-turb" type="fractalNoise" baseFrequency="0.011 0.026"
                    numOctaves="2" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div id="intro-inner">
    <div id="title-wrap">
      <span id="title-back" aria-hidden="true">FIREBREAK</span>
      <h1 id="title-front">FIREBREAK</h1>
    </div>
    <button id="intro-run" type="button">Enter</button>
  </div>
</div>

<aside id="panel">
  <section class="control" id="budget-block">
    <div class="control-head"><label class="mono" for="budget">01 BUDGET</label></div>
    <input id="budget" type="range" min="0" max="5000000" step="10000" value="0">
    <div class="ticks mono" id="budget-ticks"></div>
    <div id="budget-readout" class="mono">$0 · 0 breaks · 0 homes saved · 0 min bought</div>
  </section>

  <section id="saved-block" aria-live="polite">
    <div class="control-head"><label class="mono" id="homes-label">02 HOMES SAVED</label><span class="control-value mono" id="waffle-caption"></span></div>
    <div class="stat-value mono" id="stat-saved">0</div>
    <canvas id="waffle"></canvas>
    <div id="waffle-legend" class="mono">
      <span><i class="sw sw-grey"></i>STANDING</span>
      <span><i class="sw sw-red"></i>BURNED</span>
      <span><i class="sw sw-saved"></i>SAVED</span>
    </div>
    <p id="stat-line" class="mono">SPENT $0 &#183; +0 MIN EVACUATION</p>
  </section>

  <div id="panel-foot">
    <span id="basemap-status" class="mono">…</span>
    <span class="foot-btns">
      <button id="sound" type="button" class="mono">SOUND OFF</button>
      <button id="info-open" type="button" class="mono" aria-label="About the model">i</button>
    </span>
  </div>
</aside>

<div id="timeline" hidden>
  <button id="play" type="button" class="mono" aria-label="Play">&#9654;&#xFE0E;</button>
  <input id="time" type="range" min="0" max="720" step="5" value="0">
  <span id="time-label" class="mono">0h 00m</span>
</div>

<div id="info-modal" hidden>
  <div id="info-card">
    <button id="info-close" type="button" class="mono" aria-label="Close">Close</button>
    <h2 class="mono">BUDGET AND HOMES SAVED</h2>
    <p id="curve-sentence" class="mono"></p>
    <svg id="curve" role="img" aria-label="Cumulative cost versus cumulative homes saved"></svg>
    <h2 class="mono">REAL VS SIMPLIFIED</h2>
    <ul id="simp-list"></ul>
    <p id="story"></p>
  </div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
