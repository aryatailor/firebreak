<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebreak</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="intro" data-flow="A">
<div id="map"></div>
<div id="legend" hidden></div>
<div id="break-tip" class="mono" hidden></div>

<div id="intro">
  <div id="intro-inner">
    <h1>FIREBREAK</h1>
    <p id="intro-story">loading…</p>
    <button id="intro-run" type="button">Run the fire &#8594;</button>
  </div>
</div>

<aside id="panel">
  <header>
    <h1>FIREBREAK</h1>
    <p id="story">loading…</p>
  </header>

  <section id="guide">
    <p id="guide-line">&nbsp;</p>
    <div id="guide-actions">
      <button id="guide-primary" type="button" class="mono" hidden></button>
      <button id="guide-secondary" type="button" class="mono" hidden></button>
    </div>
  </section>

  <section id="stats" aria-live="polite">
    <div class="stat">
      <div class="stat-value mono" id="stat-1">–</div>
      <div class="stat-label mono" id="stat-1-label">homes hit</div>
    </div>
    <div class="stat">
      <div class="stat-value mono" id="stat-2">–</div>
      <div class="stat-label mono" id="stat-2-label">spent</div>
    </div>
    <div class="stat">
      <div class="stat-value mono" id="stat-3">–</div>
      <div class="stat-label mono" id="stat-3-label">homes saved</div>
    </div>
  </section>

  <section id="homes">
    <div class="control-head"><label class="mono" id="homes-label">01 — Homes</label><span class="control-value mono" id="waffle-caption"></span></div>
    <canvas id="waffle"></canvas>
    <div id="waffle-legend" class="mono">
      <span><i class="sw sw-grey"></i>STANDING</span>
      <span><i class="sw sw-red"></i>BURNED</span>
      <span><i class="sw sw-saved"></i>SAVED</span>
    </div>
  </section>

  <section class="control" id="budget-block">
    <div class="control-head"><label class="mono" for="budget">02 — Budget</label></div>
    <input id="budget" type="range" min="0" max="5000000" step="10000" value="0">
    <div class="ticks mono" id="budget-ticks"></div>
    <div id="budget-readout" class="mono">$0 · 0 breaks · 0 homes saved · 0 min bought</div>
  </section>

  <section class="control" id="time-block">
    <div class="control-head"><label class="mono" for="time">03 — Timeline</label><span class="control-value mono" id="time-label">0h 00m</span></div>
    <div class="time-row">
      <button id="play" type="button" class="mono" aria-label="Play">&#9654;&#xFE0E;</button>
      <input id="time" type="range" min="0" max="720" step="5" value="0">
    </div>
  </section>

  <details id="explore">
    <summary class="mono">04 — Budget &#8594; homes saved</summary>
    <p id="curve-sentence" class="mono"></p>
    <svg id="curve" role="img" aria-label="Cumulative cost versus cumulative homes saved"></svg>
  </details>

  <details id="simplifications">
    <summary class="mono">05 — Real vs simplified</summary>
    <ul id="simp-list"></ul>
  </details>

  <footer>
    <span id="basemap-status" class="mono">…</span>
    <button id="sound" type="button" class="mono">SOUND OFF</button>
  </footer>
</aside>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
